<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img"><title>A bounded research agent</title><desc>Tool access and a stopping condition are explicit parts of the system.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#aab7c6"/></marker></defs><path d="M226,100 L256,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M463,100 L493,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,100 L730,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M836,146 C836,214 362,214 362,146" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M937,100 L967,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#71dfce" stroke-width="2"/><text x="125" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Goal and permissions</text><rect x="261" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#b8a6ff" stroke-width="2"/><text x="362" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Model proposes action</text><rect x="498" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#ffce79" stroke-width="2"/><text x="599" y="93" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Tool runs within</text><text x="599" y="115" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">bounds</text><rect x="735" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#91baff" stroke-width="2"/><text x="836" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Observe evidence</text><rect x="972" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#71dfce" stroke-width="2"/><text x="1073" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Review or stop</text></svg>