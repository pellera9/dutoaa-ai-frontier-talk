<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img"><title>Verification gate</title><desc>Use checks capable of rejecting a generated result; select the reviewer and criteria before acting.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#aab7c6"/></marker></defs><path d="M226,100 L256,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M463,100 L493,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,100 L730,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M937,100 L967,100" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1073,146 C1073,214 362,214 362,146" stroke="#aab7c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#71dfce" stroke-width="2"/><text x="125" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Acceptance criteria</text><rect x="261" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#b8a6ff" stroke-width="2"/><text x="362" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Generate candidate</text><rect x="498" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#ffce79" stroke-width="2"/><text x="599" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Run meaningful checks</text><rect x="735" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#91baff" stroke-width="2"/><text x="836" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Accountable review</text><rect x="972" y="53" width="202" height="94" rx="14" fill="#14283a" stroke="#71dfce" stroke-width="2"/><text x="1073" y="104" fill="#f1f6fc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Accept or revise</text></svg>